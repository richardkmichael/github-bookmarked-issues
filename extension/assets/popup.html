<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Bookmarked Issues</title>

  <!-- Primer CSS -->
  <link href="https://unpkg.com/@primer/css@^21.0.0/dist/primer.css" rel="stylesheet" />

  <style>
    :root {
      --fgColor-open: #1a7f37;
      --fgColor-done: #8250df;
    }

    body {
      width: 600px;
      min-height: 400px;
      max-height: 600px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, "system-ui", "Segoe UI", sans-serif;
      overflow-y: auto;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #d0d7de;
      background-color: #f6f8fa;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .storage-info {
      font-size: 12px;
      color: #57606a;
      margin-top: 4px;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .error-message {
      padding: 12px;
      margin: 12px;
      background-color: #ffebe9;
      border: 1px solid #ff8182;
      border-radius: 6px;
      color: #82071e;
      font-size: 14px;
    }

    .issue-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .issue-item {
      display: flex;
      border-bottom: 1px solid #d0d7de;
      cursor: pointer;
      padding: 12px;
    }

    .issue-item:hover {
      background-color: #f6f8fa;
    }

    .state-icon {
      padding-top: 2px;
      padding-right: 12px;
    }

    .issue-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .issue-title a {
      color: #0969da;
      text-decoration: none;
    }

    .issue-title a:hover {
      text-decoration: underline;
    }

    .issue-meta {
      font-size: 12px;
      color: #57606a;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .issue-meta svg {
      vertical-align: text-bottom;
      display: inline-block;
    }

    .comments {
      display: flex;
      padding-top: 4px;
    }

    .comments-icon {
      padding-top: 2px;
      padding-right: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #57606a;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      margin: 0;
    }

    .btn-octicon {
      background: transparent;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      color: #57606a;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-octicon:hover:not(:disabled) {
      background: #f6f8fa;
      border-color: #8c959f;
    }

    .btn-octicon:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-octicon.success {
      color: #1a7f37;
      border-color: #1a7f37;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 class="f4 mb-0">GitHub Bookmarked Issues</h1>
      <div id="storage-info" class="storage-info"></div>
    </div>
    <button id="copy-all-btn" class="btn-octicon" type="button" title="Copy all to clipboard">
      <svg id="clipboard-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>
        <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path>
      </svg>
      <svg id="check-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display: none;">
        <path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path>
      </svg>
    </button>
  </div>

  <div id="loading" class="loading-spinner">
    <span>Loading</span>
    <span class="AnimatedEllipsis"></span>
  </div>

  <div id="error" style="display: none;"></div>

  <div id="issues-container" class="issue-list"></div>

  <div id="empty-state" style="display: none;" class="empty-state">
    <h3>No bookmarked issues yet</h3>
    <p>Click the bookmark button on GitHub issues to see them here</p>
    <p class="mt-2 text-small">They'll sync across your devices! ✨</p>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
