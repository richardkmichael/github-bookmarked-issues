<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Subscribed Issues</title>

  <!-- Primer CSS -->
  <link href="https://unpkg.com/@primer/css@^21.0.0/dist/primer.css" rel="stylesheet" />

  <style>
    body {
      width: 600px;
      min-height: 400px;
      max-height: 600px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, "system-ui", "Segoe UI", sans-serif;
      overflow-y: auto;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #d0d7de;
      background-color: #f6f8fa;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .storage-info {
      font-size: 12px;
      color: #57606a;
      margin-top: 4px;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .error-message {
      padding: 12px;
      margin: 12px;
      background-color: #ffebe9;
      border: 1px solid #ff8182;
      border-radius: 6px;
      color: #82071e;
      font-size: 14px;
    }

    .issue-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .issue-item {
      padding: 12px;
      border-bottom: 1px solid #d0d7de;
      cursor: pointer;
    }

    .issue-item:hover {
      background-color: #f6f8fa;
    }

    .issue-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .issue-title a {
      color: #0969da;
      text-decoration: none;
    }

    .issue-title a:hover {
      text-decoration: underline;
    }

    .issue-meta {
      font-size: 12px;
      color: #57606a;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #57606a;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="f4 mb-0">Subscribed Issues</h1>
    <div id="storage-info" class="storage-info"></div>
  </div>

  <div id="loading" class="loading-spinner">
    <div class="AnimatedEllipsis"></div>
    <span class="ml-2">Loading...</span>
  </div>

  <div id="error" style="display: none;"></div>

  <div id="issues-container" class="issue-list"></div>

  <div id="empty-state" style="display: none;" class="empty-state">
    <h3>No subscribed issues yet</h3>
    <p>Subscribe to issues on GitHub to see them here</p>
    <p class="mt-2 text-small">They'll sync across your devices! ✨</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
